<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenPCT — Panneau d'administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root {
    --primary: #0b2545;
    --secondary: #134074;
    --accent: #c9a961;
    --success: #2e7d5b;
    --danger: #b23a48;
  }
  body {
    background: radial-gradient(circle at 20% 0%, rgba(29, 91, 140, 0.35) 0%, transparent 50%),
                linear-gradient(135deg, #061529 0%, #0b2545 45%, #134074 100%);
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: #fff;
    padding: 30px 15px;
  }
  .admin-card {
    background: #fff;
    color: #1a2332;
    border-radius: 16px;
    border: 1px solid rgba(201, 169, 97, 0.45);
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    padding: 32px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .admin-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--primary);
    font-size: 1.7rem;
    margin-bottom: 6px;
  }
  .admin-sub { color: #64748b; margin-bottom: 24px; }
  .btn-admin {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; border: none; padding: 10px 22px; border-radius: 10px;
    font-weight: 600; transition: all 0.2s;
  }
  .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(11,37,69,0.4); color: #fff; }
  .btn-danger-soft {
    background: rgba(178,58,72,0.1); color: var(--danger); border: 1px solid var(--danger);
    padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
  }
  .btn-danger-soft:hover { background: var(--danger); color: #fff; }
  .btn-success-soft {
    background: linear-gradient(135deg, var(--success), #3a9973);
    color: #fff; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 600;
  }
  .btn-success-soft:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,125,91,0.4); color: #fff; }
  .btn-release {
    background: linear-gradient(135deg, #c9a961, #e8c96e);
    color: #4a3410; border: 1px solid #c9a961;
    padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
    font-weight: 600;
  }
  .btn-release:hover { background: linear-gradient(135deg, #b09250, #d4b25a); color: #2b1e08; }
  .stat-box {
    background: #f6f8fb; border-radius: 12px; padding: 16px; border-left: 4px solid var(--accent);
    text-align: center;
  }
  .stat-box .stat-num {
    font-size: 1.9rem; font-weight: 700; color: var(--primary); line-height: 1;
  }
  .stat-box .stat-label {
    font-size: 0.78rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
  }
  .key-row {
    background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Courier New', monospace; font-size: 0.92rem; letter-spacing: 1px;
    border: 1px solid #e2e8f0; transition: all 0.15s;
  }
  .key-row:hover { background: #eef2f7; border-color: var(--accent); }
  .key-row.used { background: #fff5f5; border-color: rgba(178,58,72,0.35); }
  .key-row.used .key-code { color: #b23a48; }
  .key-row.distributed { background: #f0f9ff; border-color: rgba(13, 110, 253, 0.35); }
  .key-row.distributed .key-code { color: #0b5ed7; }
  .key-code { font-weight: 700; color: var(--primary); }
  .key-index {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 24px;
    padding: 0 8px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0;
    margin-right: 10px;
    font-family: 'Inter', sans-serif;
    vertical-align: middle;
  }
  .badge-status { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .badge-avail { background: #d1fae5; color: #065f46; }
  .badge-used  { background: #fee2e2; color: #991b1b; }
  .badge-distributed { background: #cfe2ff; color: #084298; }
  #loginSection { max-width: 400px; margin: 80px auto; }
  .login-input {
    width: 100%; padding: 12px 14px; border: 2px solid #dbe2ea; border-radius: 10px;
    font-size: 0.95rem; margin-bottom: 12px;
  }
  .login-input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(29,91,140,0.15); }
  .msg { text-align: center; margin-top: 10px; font-size: 0.88rem; font-weight: 500; min-height: 20px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }
  .msg.info { color: var(--secondary); }
  .hidden { display: none !important; }

  /* ====== CASE À COCHER DISTRIBUTION ====== */
  .distributed-check {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: #0d6efd;
    margin-right: 12px;
    flex-shrink: 0;
    vertical-align: middle;
    transform: scale(1.15);
    border-radius: 4px;
  }
  .distributed-check:focus {
    outline: 2px solid #0d6efd;
    outline-offset: 2px;
  }

  /* ====== BOUTON ATTRIBUER ====== */
  .btn-attrib {
    background: linear-gradient(135deg, #4285F4, #1a73e8);
    color: #fff;
    border: 1px solid #4285F4;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 600;
    margin-right: 4px;
    transition: all 0.2s;
  }
  .btn-attrib:hover {
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(66, 133, 244, 0.35);
  }

  /* ====== BOUTON COPIER LA CLÉ (nouveau) ====== */
  .btn-copy-key {
    background: linear-gradient(135deg, #c9a961, #e8c96e);
    color: #4a3410;
    border: 1px solid #b09250;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 600;
    margin-right: 4px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-copy-key:hover {
    background: linear-gradient(135deg, #b09250, #d4b25a);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(201, 169, 97, 0.4);
    color: #2b1e08;
  }
  .btn-copy-key.copied {
    background: linear-gradient(135deg, var(--success), #3a9973);
    color: #fff;
    border-color: var(--success);
  }

  /* ====== BOUTON RETOUR (vers index.html) ====== */
  .btn-back-generator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #c9a961, #e8c96e);
    color: #4a3410;
    border: 1px solid #b09250;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.88rem;
    letter-spacing: 0.3px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 12px rgba(201, 169, 97, 0.3);
  }
  .btn-back-generator:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(201, 169, 97, 0.5);
    color: #2b1e08;
    text-decoration: none;
  }
  .btn-back-generator i {
    font-size: 0.95rem;
  }
  @media (max-width: 600px) {
    .btn-back-generator {
      padding: 8px 14px;
      font-size: 0.8rem;
    }
  }

  /* ====== COMPTEUR UTILISATEURS CONNECTÉS ====== */
  .admin-users-counter {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: linear-gradient(135deg, #0b2545, #134074);
    color: #fff;
    border: 1px solid rgba(201, 169, 97, 0.55);
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.25s;
    box-shadow: 0 6px 16px rgba(11, 37, 69, 0.25);
    position: relative;
    margin-left: 12px;
  }
  .admin-users-counter:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(11, 37, 69, 0.4);
    border-color: var(--accent);
  }
  .admin-users-counter i.fa-users {
    color: var(--accent);
    font-size: 0.95rem;
  }
  .admin-users-counter .counter-num {
    background: var(--accent);
    color: #4a3410;
    padding: 1px 9px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 800;
    min-width: 22px;
    text-align: center;
    line-height: 1.3;
  }
  .admin-users-counter .counter-label {
    font-size: 0.78rem;
    letter-spacing: 0.3px;
  }
  .admin-users-counter .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    50%      { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  }
  @media (max-width: 600px) {
    .admin-users-counter .counter-label { display: none; }
    .admin-users-counter { padding: 8px 12px; margin-left: 8px; }
  }

  /* ====== MODAL ATTRIBUER LICENCE ====== */
  #attribModal {
    position: fixed;
    inset: 0;
    background: rgba(11, 37, 69, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    animation: fadeInModal 0.25s ease-out;
  }
  @keyframes fadeInModal {
    from { opacity: 0; transform: scale(0.98); }
    to   { opacity: 1; transform: scale(1); }
  }
  .attrib-modal-card {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 780px;
    border: 1px solid rgba(201, 169, 97, 0.45);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    position: relative;
    color: #1a2332;
    margin: auto;
  }
  .attrib-modal-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
  }
  .attrib-modal-header {
    padding: 22px 26px 16px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
  }
  .attrib-modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--primary);
    font-size: 1.25rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .attrib-modal-header h3 i {
    color: var(--accent);
    font-size: 1.1rem;
  }
  .attrib-modal-close {
    background: transparent;
    border: none;
    font-size: 1.7rem;
    line-height: 1;
    color: #94a3b8;
    cursor: pointer;
    padding: 0 6px;
    transition: all 0.2s;
    font-weight: 300;
  }
  .attrib-modal-close:hover {
    color: var(--danger);
    transform: rotate(90deg);
  }
  .attrib-modal-body {
    padding: 20px 26px;
    max-height: 65vh;
    overflow-y: auto;
  }
  .attrib-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .attrib-field {
    margin-bottom: 0;
  }
  .attrib-field.full { grid-column: 1 / -1; }
  .attrib-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--secondary);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 6px;
  }
  .attrib-field input,
  .attrib-field textarea {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid #dbe2ea;
    border-radius: 10px;
    font-size: 0.92rem;
    font-family: inherit;
    transition: all 0.2s;
    color: #1a2332;
  }
  .attrib-field input:focus,
  .attrib-field textarea:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(29, 91, 140, 0.12);
  }
  .attrib-field input[readonly] {
    background: linear-gradient(135deg, #f6f8fb, #eef2f7);
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
    cursor: text;
    text-align: center;
    font-size: 1rem;
    border-color: var(--accent);
  }
  .attrib-field textarea {
    min-height: 260px;
    resize: vertical;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    background: #f8fafc;
    color: #334155;
  }
  .attrib-modal-footer {
    padding: 16px 26px 22px 26px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid #e2e8f0;
    background: #fafbfc;
    flex-wrap: wrap;
  }
  .attrib-footer-right {
    display: flex;
    gap: 10px;
    margin-left: auto;
  }
  .btn-attrib-close {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .btn-attrib-close:hover {
    background: #e2e8f0;
    color: #1e293b;
  }
  .btn-attrib-send {
    background: linear-gradient(135deg, #4285F4, #1a73e8);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(66, 133, 244, 0.3);
    font-size: 0.9rem;
    letter-spacing: 0.3px;
  }
  .btn-attrib-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(66, 133, 244, 0.45);
    color: #fff;
  }
  .btn-attrib-wa {
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(37, 211, 102, 0.3);
    font-size: 0.9rem;
    letter-spacing: 0.3px;
  }
  .btn-attrib-wa:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(37, 211, 102, 0.45);
    color: #fff;
  }
  .btn-attrib-send:disabled,
  .btn-attrib-wa:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-attrib-send i,
  .btn-attrib-wa i { font-size: 0.95rem; }
  .attrib-hint {
    font-size: 0.72rem;
    color: #94a3b8;
    margin-top: 6px;
    font-style: italic;
  }

  /* ====== CHAMP TÉLÉPHONE AVEC BOUTON CONTACTS ====== */
  .phone-input-group {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .phone-input-group input {
    flex: 1;
  }
  .btn-pick-contact {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    background: linear-gradient(135deg, #4285F4, #1a73e8);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.25s;
    box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
    flex-shrink: 0;
  }
  .btn-pick-contact:hover {
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(66, 133, 244, 0.45);
  }
  .btn-pick-contact i {
    color: #fff;
  }
  @media (max-width: 700px) {
    .attrib-modal-card { border-radius: 14px; }
    .attrib-modal-header { padding: 18px 20px 14px 20px; }
    .attrib-modal-header h3 { font-size: 1.1rem; }
    .attrib-modal-body { padding: 16px 20px; }
    .attrib-row { grid-template-columns: 1fr; gap: 12px; }
    .attrib-modal-footer { padding: 14px 20px 18px 20px; flex-direction: column-reverse; }
    .attrib-footer-right { flex-direction: column; width: 100%; margin-left: 0; }
    .btn-attrib-close, .btn-attrib-send, .btn-attrib-wa { width: 100%; justify-content: center; }
    .key-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .key-row > div:last-child { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
  }

  /* ====== MODAL UTILISATEURS CONNECTÉS ====== */
  #usersModal {
    position: fixed;
    inset: 0;
    background: rgba(11, 37, 69, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
    animation: fadeInModal 0.25s ease-out;
  }
  .users-modal-card {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 520px;
    border: 1px solid rgba(201, 169, 97, 0.45);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    position: relative;
    color: #1a2332;
    margin: auto;
  }
  .users-modal-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #22c55e, var(--accent), var(--secondary));
  }
  .users-modal-header {
    padding: 22px 26px 16px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
  }
  .users-modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--primary);
    font-size: 1.25rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .users-modal-header h3 i {
    color: #22c55e;
    font-size: 1.05rem;
  }
  .users-modal-body {
    padding: 20px 26px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .users-summary {
    background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .users-summary .summary-label {
    font-size: 0.82rem;
    color: #166534;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .users-summary .summary-num {
    font-size: 1.5rem;
    font-weight: 800;
    color: #15803d;
    line-height: 1;
  }
  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    margin-bottom: 8px;
    transition: all 0.15s;
    gap: 10px;
  }
  .user-row:hover {
    background: #eef2f7;
    border-color: var(--accent);
    transform: translateX(3px);
  }
  .user-row .user-email {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--primary);
    word-break: break-all;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .user-row .user-time {
    font-size: 0.72rem;
    color: #64748b;
    white-space: nowrap;
    font-family: 'Courier New', monospace;
  }
  .users-empty {
    text-align: center;
    padding: 30px 20px;
    color: #94a3b8;
    font-style: italic;
    font-size: 0.9rem;
  }
  .users-empty i {
    display: block;
    font-size: 2rem;
    margin-bottom: 12px;
    color: #cbd5e1;
  }
  .users-modal-footer {
    padding: 16px 26px 22px 26px;
    display: flex;
    justify-content: center;
    gap: 10px;
    border-top: 1px solid #e2e8f0;
    background: #fafbfc;
  }
  .btn-users-close {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    border: none;
    padding: 11px 30px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    font-size: 0.9rem;
